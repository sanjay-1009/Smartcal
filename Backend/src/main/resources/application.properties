server.port=${PORT:8080}

# Spring Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_calendar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Multipart Upload Limits (PDFs, Images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# JWT Configuration
smartcalendar.app.jwtSecret=${JWT_SECRET:smartCalendarSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026Secure}
smartcalendar.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# AI Extraction Configuration (Groq / Gemini / Fallback)
smartcalendar.ai.provider=${AI_PROVIDER:fallback}
smartcalendar.ai.groq.apiKey=${GROQ_API_KEY:}
smartcalendar.ai.groq.apiUrl=https://api.groq.com/openai/v1/chat/completions
smartcalendar.ai.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
smartcalendar.ai.gemini.apiKey=${GEMINI_API_KEY:}
smartcalendar.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# Real-Time Free Email OTP Configuration (Gmail SMTP - Port 465 SSL)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:gskgm2006@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:lpkwuhywqeeuthzx}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000




# Logging
logging.level.com.smartcalendar=INFO
logging.level.org.springframework.security=INFO
